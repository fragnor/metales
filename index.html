<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Metales</title>
  <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@400;600&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --primary: #2c3e50;
      --secondary: #34495e;
      --accent: #d35400;
      --light: #ecf0f1;
      --white: #ffffff;
      --border: #bdc3c7;
      --danger: #e74c3c;
    }

    body { font-family: 'Segoe UI', Tahoma, sans-serif; background-color: var(--light); margin: 0; }
    
    #login-screen {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: var(--primary); display: flex; align-items: center; justify-content: center; z-index: 1000;
    }
    .login-card { background: var(--white); padding: 40px; border-radius: 10px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); width: 320px; text-align: center; }

    header { background: var(--primary); color: var(--white); padding: 15px; text-align: center; display: flex; justify-content: space-between; align-items: center; }
    header h2 { margin: 0; font-size: 20px; }
    
    .nav-modulos { display: flex; background: #1a252f; }
    .nav-modulos button { flex: 1; padding: 12px; background: none; border: none; color: #7f8c8d; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 14px; }
    .nav-modulos button.active { color: var(--white); background: var(--accent); }

    .global-controls { background: var(--white); padding: 15px; display: flex; gap: 15px; justify-content: center; border-bottom: 2px solid var(--border); }
    .global-controls div { display: flex; align-items: center; gap: 10px; font-weight: bold; color: var(--primary); }
    .global-controls input, .global-controls select { margin: 0; padding: 8px; width: auto; }

    nav.tabs { display: flex; background: var(--secondary); overflow-x: auto; }
    .tab-btn { flex: 1; padding: 15px; border: none; background: none; color: var(--border); cursor: pointer; font-weight: 600; transition: 0.3s; }
    .tab-btn.active { color: var(--white); border-bottom: 4px solid var(--accent); background: rgba(255,255,255,0.1); }

    .container { padding: 20px; max-width: 700px; margin: auto; }
    .sub-tabs { display: flex; margin-bottom: 20px; gap: 10px; }
    .sub-tab-btn { flex: 1; padding: 10px; border: 1px solid var(--border); background: var(--light); cursor: pointer; font-weight: bold; border-radius: 5px; color: var(--primary); }
    .sub-tab-btn.active { background: var(--primary); color: var(--white); border-color: var(--primary); }

    .card { background: var(--white); padding: 25px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
    
    .form-group { margin-bottom: 15px; }
    label { display: block; font-weight: bold; color: var(--secondary); margin-bottom: 5px; font-size: 14px; }
    input, select { width: 100%; padding: 10px; border-radius: 5px; border: 1px solid var(--border); box-sizing: border-box; font-size: 15px; }
    input[readonly] { background-color: #e8ecef; color: #7f8c8d; cursor: not-allowed; font-weight: bold; }
    
    button.btn-submit { background: var(--accent); color: white; border: none; padding: 15px; border-radius: 5px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 10px; font-size: 16px; transition: 0.2s; }
    button.btn-submit:disabled { background: #95a5a6; }

    .hidden { display: none !important; }
    .loader { text-align: center; color: var(--accent); font-weight: bold; margin-top: 10px; }
    
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }

    /* Estilos para lista de incidencias recientes */
    .contenedor-recientes { margin-top: 25px; border-top: 2px dashed var(--border); padding-top: 15px; }
    .incidencia-item { background: #fdfbfb; border: 1px solid #e1e8ed; padding: 10px 15px; border-radius: 5px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-size: 14px; }
    .btn-borrar { background: var(--danger); color: white; border: none; padding: 6px 10px; border-radius: 4px; cursor: pointer; font-size: 14px; }
    .btn-borrar:hover { background: #c0392b; }
  </style>
</head>
<body>

  <div id="login-screen">
    <div class="login-card">
      <h2 style="margin-top:0; color:var(--primary);">METALES</h2>
      <div class="form-group"><input type="text" id="user" placeholder="Usuario"></div>
      <div class="form-group"><input type="password" id="pass" placeholder="Contraseña"></div>
      <button class="btn-submit" id="btn-login" onclick="ejecutarLogin()">ENTRAR</button>
      <div id="login-status" class="loader"></div>
    </div>
  </div>

  <div id="app" class="hidden">
    <header>
      <h2>METALES APP</h2>
      <span id="header-usuario" style="font-weight:bold; font-size: 14px;"></span>
    </header>

    <div class="nav-modulos">
      <button id="nav-prod" class="active" onclick="cambiarModulo('produccion')">🛠️ PRODUCCIÓN E INCIDENCIAS</button>
      <button id="nav-pruebas" onclick="cambiarModulo('pruebas')">🧪 MÓDULO DE PRUEBAS</button>
    </div>

    <div id="modulo-produccion">
      <div class="global-controls">
        <div>Fecha: <input type="date" id="global-fecha"></div>
        <div>Turno: 
          <select id="global-turno" onchange="generarHorasDesplegable()">
            <option value="Mañana">Mañana (06:00 - 14:00)</option>
            <option value="Tarde">Tarde (14:00 - 22:00)</option>
            <option value="Noche">Noche (22:00 - 06:00)</option>
          </select>
        </div>
      </div>

      <nav class="tabs">
        <button class="tab-btn active" onclick="cambiarMaquina(event, 'Finder')">FINDER</button>
        <button class="tab-btn" onclick="cambiarMaquina(event, 'Zurik')">ZURIK</button>
        <button class="tab-btn" onclick="cambiarMaquina(event, 'Medios densos')">M. DENSOS</button>
        <button class="tab-btn" onclick="cambiarMaquina(event, 'Steinert')">STEINERT</button>
      </nav>

      <div class="container">
        <h3 id="titulo-maquina" style="color: var(--primary); text-align: center; text-transform: uppercase;">MÁQUINA: FINDER</h3>

        <div class="sub-tabs">
          <button id="tab-horas" class="sub-tab-btn active" onclick="cambiarSeccion('horas')">1. PRODUCCIÓN</button>
          <button id="tab-incidencias" class="sub-tab-btn" onclick="cambiarSeccion('incidencias')">2. INCIDENCIAS</button>
        </div>

        <div id="seccion-horas" class="card">
          <div class="form-group" style="background: #f8f9fa; padding: 15px; border-left: 4px solid var(--accent); border-radius: 4px;">
            <label style="color: var(--accent);">Nº DE LOTE (Obligatorio)</label>
            <input type="text" id="prod-lote" placeholder="Introduce el lote de producción actual" oninput="marcarModificadoProduccion()">
          </div>

          <div id="form-std">
            <div class="grid-2">
              <div class="form-group">
                <label>Horas de máquina iniciales</label>
                <input type="number" id="h-iniciales" readonly placeholder="Cargando...">
              </div>
              <div class="form-group">
                <label>Horas de máquina finales</label>
                <input type="number" id="h-finales" placeholder="Introduce horas finales" oninput="marcarModificadoProduccion()">
              </div>
            </div>
            <button class="btn-submit" id="btn-guardar-horas" onclick="guardarHoras()">GUARDAR PRODUCCIÓN</button>
            <div id="status-horas" class="loader"></div>
          </div>

          <div id="form-md" class="hidden">
            <div class="form-group">
              <label>Operario</label>
              <select id="md-operario"></select>
            </div>
            <div class="grid-2">
              <div class="form-group"><label>Horas Máquina Iniciales</label><input type="number" id="md-h-maq-ini" readonly></div>
              <div class="form-group"><label>Horas Máquina Finales</label><input type="number" id="md-h-maq-fin" placeholder="Obligatorio" oninput="marcarModificadoProduccion()"></div>
            </div>
            <div class="grid-2">
              <div class="form-group"><label>Horas Prod. Inicio</label><input type="number" id="md-h-prod-ini" readonly></div>
              <div class="form-group"><label>Horas Prod. Fin</label><input type="number" id="md-h-prod-fin" placeholder="Obligatorio" oninput="marcarModificadoProduccion()"></div>
            </div>
            <div class="grid-2">
              <div class="form-group"><label>Contador Inicio</label><input type="number" id="md-cont-ini" readonly></div>
              <div class="form-group"><label>Contador Fin</label><input type="number" id="md-cont-fin" placeholder="Obligatorio" oninput="marcarModificadoProduccion()"></div>
            </div>
            <div class="grid-2">
              <div class="form-group"><label>FeSi (Nº saca)</label><input type="number" id="md-fesi" step="any" placeholder="" oninput="marcarModificadoProduccion()"></div>
              <div class="form-group"><label>Observaciones</label><input type="text" id="md-obs" placeholder="Opcional" oninput="marcarModificadoProduccion()"></div>
            </div>
            <button class="btn-submit" id="btn-guardar-md" onclick="guardarMediosDensos()">GUARDAR PRODUCCIÓN (M. DENSOS)</button>
            <div id="status-md" class="loader"></div>
          </div>
        </div>

        <div id="seccion-incidencias" class="card hidden">
          <div class="form-group"><label>Activo Afectado</label><select id="inc-maquina" onchange="marcarModificadoIncidencia()"></select></div>
          <div class="grid-2">
            <div class="form-group"><label>Hora Parada</label><select id="inc-h-parada" onchange="marcarModificadoIncidencia()"></select></div>
            <div class="form-group"><label>Hora Arranque</label><select id="inc-h-arranque" onchange="marcarModificadoIncidencia()"></select></div>
          </div>
          <div class="form-group"><label>Motivo Parada</label><select id="inc-motivo" onchange="marcarModificadoIncidencia()"></select></div>
          <div class="form-group"><label>Observaciones</label><input type="text" id="inc-obs" placeholder="Detalles de la incidencia..." oninput="marcarModificadoIncidencia()"></div>
          
          <button class="btn-submit" id="btn-guardar-incidencia" onclick="guardarIncidencia()">GUARDAR INCIDENCIA</button>
          <div id="status-incidencias" class="loader"></div>

          <div id="contenedor-recientes" class="contenedor-recientes hidden">
            <h4 style="color: var(--secondary); margin-top: 0;">Últimas registradas (en esta sesión)</h4>
            <div id="lista-incidencias"></div>
          </div>
        </div>
      </div>
    </div>

    <div id="modulo-pruebas" class="hidden">
      <div class="container">
        <div class="card">
          <h2 style="color: var(--primary); text-align: center; margin-top: 0;">NUEVA PRUEBA</h2>
          <p style="text-align: center; color: var(--secondary); font-size: 14px; margin-bottom: 20px;">Registro independiente de pruebas de material</p>
          
          <div class="form-group">
            <label>Proveedor</label>
            <input type="text" id="prueba-proveedor" placeholder="Escribe el nombre del proveedor...">
          </div>
          <div class="form-group">
            <label>Línea de Proceso</label>
            <select id="prueba-linea">
              <option value="Finder">Finder</option>
              <option value="Zurik">Zurik</option>
              <option value="Steinert">Steinert</option>
              <option value="Medios densos">Medios densos</option>
              <option value="Molino">Molino</option>
            </select>
          </div>
          
          <hr style="border: 0; border-top: 1px solid var(--border); margin: 25px 0;">
          
          <div class="form-group"><label>Campo Libre 1</label><input type="text" id="prueba-c1"></div>
          <div class="form-group"><label>Campo Libre 2</label><input type="text" id="prueba-c2"></div>
          <div class="form-group"><label>Campo Libre 3</label><input type="text" id="prueba-c3"></div>
          <div class="form-group"><label>Campo Libre 4</label><input type="text" id="prueba-c4"></div>
          <div class="form-group"><label>Campo Libre 5</label><input type="text" id="prueba-c5"></div>

          <button class="btn-submit" id="btn-guardar-prueba" onclick="guardarPrueba()">REGISTRAR PRUEBA</button>
          <div id="status-prueba" class="loader"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    // PEGA AQUÍ TU URL DE GOOGLE APPS SCRIPT
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxCJJSoN1w_ysQH6bpADV5s3I8tMBcNTif1tdupNO8uJzRO2FB2WwzlJOeGrtLTClZr/exec"; 

    let USUARIO_ACTUAL = "";
    let MAQUINA_ACTUAL = "Finder";
    
    let LISTAS_ACTIVOS = { "Finder": [], "Zurik": [], "Medios densos": [], "Steinert": [] };
    
    let datosIncidenciaModificados = false;
    let datosProduccionModificados = false;
    
    let incidenciasRecientes = []; 

    function ejecutarLogin() {
      const u = document.getElementById("user").value;
      const p = document.getElementById("pass").value;
      const status = document.getElementById("login-status");

      if (!u || !p) return alert("Escribe usuario y contraseña");

      status.innerText = "Conectando con Excel...";
      document.getElementById("btn-login").disabled = true;

      const datos = new URLSearchParams();
      datos.append('accion', 'login');
      datos.append('user', u);
      datos.append('pass', p);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          USUARIO_ACTUAL = res.user;
          document.getElementById("login-screen").classList.add("hidden");
          document.getElementById("app").classList.remove("hidden");
          document.getElementById("header-usuario").innerText = "👤 " + USUARIO_ACTUAL;
          document.getElementById("global-fecha").valueAsDate = new Date();
          
          LISTAS_ACTIVOS["Finder"] = res.activosFinder || [];
          LISTAS_ACTIVOS["Zurik"] = res.activosZurik || [];
          LISTAS_ACTIVOS["Medios densos"] = res.activosMD || [];
          LISTAS_ACTIVOS["Steinert"] = res.activosSteinert || [];

          poblarDesplegable("inc-motivo", res.motivos);
          poblarDesplegable("md-operario", res.operarios);
          poblarDesplegable("inc-maquina", LISTAS_ACTIVOS[MAQUINA_ACTUAL]);
          
          generarHorasDesplegable();
          cargarHorasIniciales();
        } else {
          alert("Acceso denegado. Revisa tus datos.");
          document.getElementById("btn-login").disabled = false;
        }
      })
      .catch(err => {
        alert("Error de conexión");
        document.getElementById("btn-login").disabled = false;
      })
      .finally(() => status.innerText = "");
    }

    function cambiarModulo(modulo) {
      if (modulo === 'pruebas') {
        if (datosIncidenciaModificados || datosProduccionModificados) {
          if (!confirm("Tienes datos de producción sin guardar. ¿Seguro que quieres ir a pruebas?")) return;
        }
        document.getElementById("modulo-produccion").classList.add("hidden");
        document.getElementById("modulo-pruebas").classList.remove("hidden");
        document.getElementById("nav-prod").classList.remove("active");
        document.getElementById("nav-pruebas").classList.add("active");
      } else {
        document.getElementById("modulo-pruebas").classList.add("hidden");
        document.getElementById("modulo-produccion").classList.remove("hidden");
        document.getElementById("nav-pruebas").classList.remove("active");
        document.getElementById("nav-prod").classList.add("active");
      }
    }

    function poblarDesplegable(idElemento, arrayDatos) {
      const select = document.getElementById(idElemento);
      select.innerHTML = "";
      arrayDatos.forEach(dato => {
        select.innerHTML += `<option value="${dato}">${dato}</option>`;
      });
    }

    function generarHorasDesplegable() {
      const turno = document.getElementById("global-turno").value;
      let horas = [];

      if (turno === "Mañana") horas = calcularRangoHoras(6, 14);
      else if (turno === "Tarde") horas = calcularRangoHoras(14, 22);
      else if (turno === "Noche") {
        horas = calcularRangoHoras(22, 23, true).concat(calcularRangoHoras(0, 6));
      }

      let opcionesHTML = "";
      horas.forEach(h => opcionesHTML += `<option value="${h}">${h}</option>`);
      document.getElementById("inc-h-parada").innerHTML = opcionesHTML;
      document.getElementById("inc-h-arranque").innerHTML = opcionesHTML;
    }

    function calcularRangoHoras(inicio, fin, esFinDeDia = false) {
      let result = [];
      let limiteH = esFinDeDia ? 24 : fin;
      for (let h = inicio; h < limiteH; h++) {
        for (let m = 0; m < 60; m += 10) {
          result.push(`${h.toString().padStart(2, '0')}:${m.toString().padStart(2, '0')}`);
        }
      }
      if (!esFinDeDia) result.push(`${fin.toString().padStart(2, '0')}:00`);
      return result;
    }

    function marcarModificadoIncidencia() { datosIncidenciaModificados = true; }
    function marcarModificadoProduccion() { datosProduccionModificados = true; }

    function limpiarFormularioIncidencias() {
      document.getElementById("inc-obs").value = "";
      document.getElementById("inc-maquina").selectedIndex = 0;
      document.getElementById("inc-motivo").selectedIndex = 0;
      document.getElementById("inc-h-parada").selectedIndex = 0;
      document.getElementById("inc-h-arranque").selectedIndex = 0;
      datosIncidenciaModificados = false; 
    }

    function limpiarFormularioProduccion() {
      document.getElementById("prod-lote").value = "";
      document.getElementById("h-finales").value = "";
      document.getElementById("md-h-maq-fin").value = "";
      document.getElementById("md-h-prod-fin").value = "";
      document.getElementById("md-cont-fin").value = "";
      document.getElementById("md-fesi").value = "";
      document.getElementById("md-obs").value = "";
      datosProduccionModificados = false;
    }

    function cambiarMaquina(evt, nombre) {
      if (datosIncidenciaModificados || datosProduccionModificados) {
        if (!confirm("Tienes datos sin guardar. Si cambias de máquina se perderán. ¿Continuar?")) return;
        limpiarFormularioIncidencias();
        limpiarFormularioProduccion();
      }

      MAQUINA_ACTUAL = nombre;
      document.getElementById("titulo-maquina").innerText = "MÁQUINA: " + nombre;
      
      const botones = document.getElementsByClassName("tab-btn");
      for (let b of botones) b.classList.remove("active");
      evt.currentTarget.classList.add("active");

      if (nombre === "Medios densos") {
        document.getElementById("form-std").classList.add("hidden");
        document.getElementById("form-md").classList.remove("hidden");
      } else {
        document.getElementById("form-std").classList.remove("hidden");
        document.getElementById("form-md").classList.add("hidden");
      }
      
      poblarDesplegable("inc-maquina", LISTAS_ACTIVOS[nombre]);
      incidenciasRecientes = []; 
      renderizarIncidenciasRecientes();

      cambiarSeccion('horas');
      cargarHorasIniciales();
    }

    function cambiarSeccion(seccion) {
      if (seccion === 'horas' && datosIncidenciaModificados) {
        if (!confirm("Tienes incidencias sin guardar. ¿Cambiar de pestaña?")) return;
        limpiarFormularioIncidencias();
      }
      if (seccion === 'incidencias' && datosProduccionModificados) {
        if (!confirm("Tienes producción sin guardar. ¿Cambiar de pestaña?")) return;
        limpiarFormularioProduccion();
      }

      document.getElementById("tab-horas").classList.remove("active");
      document.getElementById("tab-incidencias").classList.remove("active");
      document.getElementById("seccion-horas").classList.add("hidden");
      document.getElementById("seccion-incidencias").classList.add("hidden");

      document.getElementById("tab-" + seccion).classList.add("active");
      document.getElementById("seccion-" + seccion).classList.remove("hidden");
    }

    function cargarHorasIniciales() {
      if (MAQUINA_ACTUAL === "Medios densos") {
        document.getElementById("md-h-maq-ini").placeholder = "Cargando...";
        document.getElementById("md-h-prod-ini").placeholder = "Cargando...";
        document.getElementById("md-cont-ini").placeholder = "Cargando...";
        document.getElementById("md-h-maq-ini").value = "";
        document.getElementById("md-h-prod-ini").value = "";
        document.getElementById("md-cont-ini").value = "";
      } else {
        document.getElementById("h-iniciales").placeholder = "Cargando...";
        document.getElementById("h-iniciales").value = "";
      }
      
      fetch(SCRIPT_URL, { method: 'POST', body: new URLSearchParams({accion: 'getHoras', maquina: MAQUINA_ACTUAL}) })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          if (MAQUINA_ACTUAL === "Medios densos") {
            document.getElementById("md-h-maq-ini").value = res.hMaq;
            document.getElementById("md-h-prod-ini").value = res.hProd;
            document.getElementById("md-cont-ini").value = res.cont;
          } else {
            document.getElementById("h-iniciales").value = res.horas;
          }
        }
      });
    }

    function guardarHoras() {
      const f = document.getElementById("global-fecha").value;
      const t = document.getElementById("global-turno").value;
      const lote = document.getElementById("prod-lote").value.trim();
      const hIni = document.getElementById("h-iniciales").value;
      const hFin = document.getElementById("h-finales").value;
      
      if (!f || !hFin || !lote) return alert("Falta fecha, lote o las horas finales.");

      const status = document.getElementById("status-horas");
      const btn = document.getElementById("btn-guardar-horas");
      status.innerText = "Guardando..."; btn.disabled = true;

      const datos = new URLSearchParams();
      datos.append('accion', 'guardarHoras');
      datos.append('maquina', MAQUINA_ACTUAL);
      datos.append('fecha', f);
      datos.append('turno', t);
      datos.append('usuario', USUARIO_ACTUAL);
      datos.append('horasIni', hIni);
      datos.append('horasFin', hFin);
      datos.append('lote', lote);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert(res.mensaje);
          limpiarFormularioProduccion();
          cargarHorasIniciales();
        } else alert("Error: " + res.error);
      })
      .finally(() => { status.innerText = ""; btn.disabled = false; });
    }

    function guardarMediosDensos() {
      const f = document.getElementById("global-fecha").value;
      const t = document.getElementById("global-turno").value;
      const lote = document.getElementById("prod-lote").value.trim();
      const op = document.getElementById("md-operario").value;

      const hMi = document.getElementById("md-h-maq-ini").value;
      const hMf = document.getElementById("md-h-maq-fin").value;
      const hPi = document.getElementById("md-h-prod-ini").value;
      const hPf = document.getElementById("md-h-prod-fin").value;
      const ci = document.getElementById("md-cont-ini").value;
      const cf = document.getElementById("md-cont-fin").value;
      const fesi = document.getElementById("md-fesi").value;
      const obs = document.getElementById("md-obs").value;

      if (!f || !lote || !hMf || !hPf || !cf) {
        return alert("Rellena el Lote y todos los campos de horas/contador finales.");
      }

      const status = document.getElementById("status-md");
      const btn = document.getElementById("btn-guardar-md");
      status.innerText = "Guardando Producción..."; btn.disabled = true;

      const datos = new URLSearchParams();
      datos.append('accion', 'guardarMD');
      datos.append('fecha', f);
      datos.append('turno', t);
      datos.append('operario', op);
      datos.append('hMaqIni', hMi);
      datos.append('hMaqFin', hMf);
      datos.append('hProdIni', hPi);
      datos.append('hProdFin', hPf);
      datos.append('contIni', ci);
      datos.append('contFin', cf);
      datos.append('fesi', fesi);
      datos.append('obs', obs);
      datos.append('lote', lote);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert(res.mensaje);
          limpiarFormularioProduccion();
          cargarHorasIniciales();
        } else alert("Error: " + res.error);
      })
      .finally(() => { status.innerText = ""; btn.disabled = false; });
    }

    function validarHorasFront(hParada, hArranque, turno) {
      const p = hParada.split(":");
      const a = hArranque.split(":");
      const minP = parseInt(p[0]) * 60 + parseInt(p[1]);
      const minA = parseInt(a[0]) * 60 + parseInt(a[1]);
      
      if (minA <= minP) {
        if (turno === "Noche" && minP >= 1320 && minA <= 360) {
          return true; // Válido en turno de noche cruzando medianoche
        }
        return false;
      }
      return true;
    }

    function guardarIncidencia() {
      const f = document.getElementById("global-fecha").value;
      const t = document.getElementById("global-turno").value;
      const hParada = document.getElementById("inc-h-parada").value;
      const hArranque = document.getElementById("inc-h-arranque").value;
      const motivo = document.getElementById("inc-motivo").value;
      const maqAfectada = document.getElementById("inc-maquina").value;
      const obs = document.getElementById("inc-obs").value;

      if (!f || !motivo) return alert("Faltan datos obligatorios (Fecha o Motivo)");
      
      if (!validarHorasFront(hParada, hArranque, t)) {
        return alert("❌ ERROR: La hora de arranque no puede ser anterior a la hora de parada (Revisa los tiempos).");
      }

      const status = document.getElementById("status-incidencias");
      const btn = document.getElementById("btn-guardar-incidencia");
      status.innerText = "Guardando..."; btn.disabled = true;

      const datos = new URLSearchParams();
      datos.append('accion', 'guardarIncidencia');
      datos.append('maquina', MAQUINA_ACTUAL); 
      datos.append('fecha', f);
      datos.append('turno', t);
      datos.append('usuario', USUARIO_ACTUAL);
      datos.append('horaParada', hParada);
      datos.append('horaArranque', hArranque);
      datos.append('motivo', motivo);
      datos.append('maquinaAfectada', maqAfectada);
      datos.append('observaciones', obs);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          incidenciasRecientes.push({
            id: res.idUnico,
            texto: `${hParada} a ${hArranque} | ${maqAfectada} | ${motivo}`
          });
          if (incidenciasRecientes.length > 3) incidenciasRecientes.shift();
          renderizarIncidenciasRecientes();
          limpiarFormularioIncidencias();
        } else alert("Error del servidor: " + res.error);
      })
      .finally(() => { status.innerText = ""; btn.disabled = false; });
    }

    function borrarIncidenciaLocal(idUnico) {
      if (!confirm("¿Seguro que quieres eliminar esta incidencia del Excel?")) return;
      const status = document.getElementById("status-incidencias");
      status.innerText = "Borrando...";
      const datos = new URLSearchParams();
      datos.append('accion', 'borrarIncidencia');
      datos.append('maquina', MAQUINA_ACTUAL);
      datos.append('idUnico', idUnico);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          incidenciasRecientes = incidenciasRecientes.filter(inc => inc.id !== idUnico);
          renderizarIncidenciasRecientes();
        } else alert("Error: " + res.error);
      })
      .finally(() => status.innerText = "");
    }

    function renderizarIncidenciasRecientes() {
      const contenedor = document.getElementById("contenedor-recientes");
      const listaDiv = document.getElementById("lista-incidencias");
      
      if (incidenciasRecientes.length === 0) {
        contenedor.classList.add("hidden");
        listaDiv.innerHTML = "";
        return;
      }
      contenedor.classList.remove("hidden");
      listaDiv.innerHTML = "";
      const invertidas = [...incidenciasRecientes].reverse();
      invertidas.forEach(inc => {
        listaDiv.innerHTML += `
          <div class="incidencia-item">
            <span>${inc.texto}</span>
            <button class="btn-borrar" onclick="borrarIncidenciaLocal('${inc.id}')">🗑️</button>
          </div>`;
      });
    }

    function guardarPrueba() {
      const prov = document.getElementById("prueba-proveedor").value.trim();
      if (!prov) return alert("El campo Proveedor es obligatorio.");

      const f = document.getElementById("global-fecha").value || new Date().toLocaleDateString();
      const status = document.getElementById("status-prueba");
      const btn = document.getElementById("btn-guardar-prueba");
      status.innerText = "Guardando prueba..."; btn.disabled = true;

      const datos = new URLSearchParams();
      datos.append('accion', 'guardarPrueba');
      datos.append('usuario', USUARIO_ACTUAL);
      datos.append('fecha', f);
      datos.append('proveedor', prov);
      datos.append('linea', document.getElementById("prueba-linea").value);
      datos.append('campo1', document.getElementById("prueba-c1").value);
      datos.append('campo2', document.getElementById("prueba-c2").value);
      datos.append('campo3', document.getElementById("prueba-c3").value);
      datos.append('campo4', document.getElementById("prueba-c4").value);
      datos.append('campo5', document.getElementById("prueba-c5").value);

      fetch(SCRIPT_URL, { method: 'POST', body: datos })
      .then(res => res.json())
      .then(res => {
        if (res.success) {
          alert("✅ Prueba guardada con éxito en el Excel.");
          document.getElementById("prueba-proveedor").value = "";
          document.getElementById("prueba-c1").value = "";
          document.getElementById("prueba-c2").value = "";
          document.getElementById("prueba-c3").value = "";
          document.getElementById("prueba-c4").value = "";
          document.getElementById("prueba-c5").value = "";
        } else alert("Error: " + res.error);
      })
      .finally(() => { status.innerText = ""; btn.disabled = false; });
    }
  </script>
